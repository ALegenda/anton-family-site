<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Квитанция семейного атласа</title>
</head>
<body>
  <main>
    <h1>Квитанция семейного атласа</h1>
    <p>Эту страницу можно закрыть.</p>
  </main>
  <script>
    const submission = new URLSearchParams(location.search).get("submission");
    const receiver = window.parent === window ? window.opener : window.parent;
    if (receiver && /^[a-f0-9]{32}$/.test(submission || "")) {
      receiver.postMessage({ type: "family-atlas-contribution-receipt", submission }, location.origin);
    }
  </script>
</body>
</html>
